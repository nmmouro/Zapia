<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Painel Frota - Veículos
    </title>


    <!-- ================= CSS ================= -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/veiculos.css">

    <link rel="stylesheet" href="css/components.css">

</head>

<body>

<!-- ======================================================================
     HEADER
====================================================================== -->

<header class="header">

    <div class="header-logo">

        <img

            src="assets/img/logo.png"

            alt="Logo Frota"

        >

    </div>

    <div class="header-title">

        <h1>

            VEÍCULOS

        </h1>

    </div>

    <div class="header-info">

        <div

            id="clock"

            class="clock"

        >

        </div>

        <button

            id="btnFullscreen"

            class="btn-icon"

        >

            ⛶

        </button>

    </div>

</header>

<!-- ======================================================================
     CONTEÚDO
====================================================================== -->

<main class="page-container">

<!-- ======================================================================
     FORMULÁRIO
====================================================================== -->

    <section class="card">

    <h2>

        CADASTRO DE VEÍCULO

    </h2>

    <form

        id="formveiculo"

        class="form-grid"

    >

        <div class="form-group">

 <label for="data">
Data
</label>

<input

type="date"

id="data"

name="data"

required

>

</div>

        <!-- PLACA -->

        <div class="form-group">

            <label for="placa">

                Placa

            </label>

            <input

                type="text"
                
                id="placa"

                name="placa"

                placeholder="Ex: ABC1D23"

                required

            >

        </div>

        <!-- MODELO -->

        <div class="form-group">

            <label for="modelo">

                Modelo

            </label>

            <input

                type="text"
                id="modelo"
                name="modelo"

                required

            >

        </div>

        <!-- MARCA -->

        <div class="form-group">

             <label for="marca">

                Marca

            </label>

            <input

                type="text"
                id="marca"
                name="marca"

            >

        </div>

        <!-- ANO -->

        <div class="form-group">

            <label for="ano">

                Ano

            </label>

            <input

                type="number"
                id="ano"
                name="ano"

                min="1900"

            >

        </div>

        <!-- COR -->

        <div class="form-group">

            <label for="cor">

                Cor

            </label>

            <input

                type="text"
                id="cor"
                name="cor"

            >

        </div>

        <!-- COMBUSTÍVEL -->

        <div class="form-group">

            <label for="combustivel">

                Combustível

            </label>

            <select

                id="combustivel"
                name="combustivel"

            >

                <option>

                    GASOLINA

                </option>

                <option>

                    ETANOL

                </option>

                <option>

                    DIESEL

                </option>


                <option>

                    FLEX

                </option>

                <option>

                    ELÉTRICO

                </option>

            </select>

        </div>

        <!-- STATUS -->

        <div class="form-group">

            <label for="status">

                Status

            </label>

            <select

                id="status"
                
                name="status"

            >

                <option>

                    LIVRE

                </option>

                <option>

                    OCUPADO

                </option>


                <option>

                    MANUTENÇÃO

                </option>

                <option>

                    INATIVO

                </option>

            </select>

        </div>

        <!-- BOTÕES -->

        <div class="form-actions">

            <button

                type="submit"

                id="btnSalvar"

                class="btn-primary"

            >

                SALVAR

            </button>

<button

type="button"

id="btnNovo"

class="btn-secondary">

NOVO

</button>

            <button

                type="reset"

                class="btn-secondary"

            >

                LIMPAR

            </button>

        </div>

    </form>

</section>

<!-- ======================================================================
     LISTAGEM
====================================================================== -->

<section class="card">

    <h2>

        VEÍCULOS CADASTRADOS

    </h2>

    <div class="table-container">

      <div

        id="tabelaveiculos">

    </div>

    </div>

</section>

</main>

<!-- ======================================================================
     LOADING
====================================================================== -->

<div

    id="loading"

    class="loading-overlay"

>

</div>

<!-- ======================================================================
     JAVASCRIPT
====================================================================== -->

<script

    type="module"

    src="js/pages/veiculos.js"

></script>

</body>

</html>
